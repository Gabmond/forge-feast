<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forge & Feast contact page coming soon.">
    <title>Contact Coming Soon | Forge &amp; Feast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .placeholder-page { display: grid; min-height: 100svh; padding: 3rem; place-items: center; background: var(--background-primary); }
        .placeholder-page__content { width: min(100%, 68rem); padding: clamp(3rem, 8vw, 8rem) clamp(2rem, 7vw, 7rem); text-align: center; background: var(--background-secondary); border-top: 4px solid var(--secondary-base); box-shadow: 0 1.2rem 3.5rem rgb(0 0 0 / 10%); }
        .placeholder-page__brand { margin-bottom: 4rem; color: var(--primary-base); font-family: var(--font-family-headings); font-size: clamp(3.6rem, 7vw, 5.5rem); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); }
        .placeholder-page__brand span, .placeholder-page__eyebrow { color: var(--secondary-base); }
        .placeholder-page__eyebrow { margin-bottom: 1.5rem; font-family: var(--font-family-body); font-size: var(--text-sm); font-weight: var(--font-weight-bold); letter-spacing: var(--letter-spacing-normal); text-transform: uppercase; }
        .placeholder-page h1 { margin-bottom: 2rem; color: var(--primary-base); font-family: var(--font-family-headings); font-size: clamp(4.5rem, 9vw, 7.5rem); }
        .placeholder-page__message { max-width: 48rem; margin: 0 auto 3.5rem; color: var(--text-secondary); line-height: var(--line-height-spaced); }
        .placeholder-page__button { display: inline-block; padding: 1.4rem 2.4rem; color: var(--white); background: var(--tertiary-base); font-family: var(--font-family-body); font-size: var(--text-base); font-weight: var(--font-weight-bold); transition: background-color 0.2s ease, transform 0.2s ease; }
        .placeholder-page__button:hover, .placeholder-page__button:focus-visible { background: var(--tertiary-shade); transform: translateY(-2px); }
        @media (max-width: 480px) { .placeholder-page { padding: 1.5rem; } .placeholder-page__content { padding: 4rem 2rem; } .placeholder-page__brand { margin-bottom: 3rem; } }
    </style>
</head>
<body>
    <main class="placeholder-page">
        <section class="placeholder-page__content" aria-labelledby="page-title">
            <p class="placeholder-page__brand">Forge <span>&amp;</span> Feast</p>
            <p class="placeholder-page__eyebrow">Coming Soon</p>
            <h1 id="page-title">Contact</h1>
            <p class="placeholder-page__message">Our contact page is being prepared. We will make it easy to get in touch with Forge &amp; Feast soon.</p>
            <a class="placeholder-page__button" href="index.html">Return Home</a>
        </section>
    </main>
</body>
</html>
